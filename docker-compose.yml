x-service-defaults: &service-defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-app-env: &app-env
  TZ: America/Bogota
  APP_ORIGIN: ${APP_ORIGIN:?APP_ORIGIN es obligatorio}
  DATABASE_URL: postgresql://finanzas:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio}@postgres:5432/finanzas
  REDIS_URL: redis://redis:6379
  FIREFLY_BASE_URL: http://firefly:8080
  AI_CFO_URL: http://ai-cfo:8000
  AI_CFO_INTERNAL_TOKEN: ${AI_CFO_INTERNAL_TOKEN:?AI_CFO_INTERNAL_TOKEN es obligatorio}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:?VAPID_PUBLIC_KEY es obligatorio}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:?VAPID_PRIVATE_KEY es obligatorio}
  PRIVATE_METADATA_KEYRING_FILE: /run/secrets/okle_private_metadata_keyring
  PRIVATE_METADATA_ENCRYPTION_KEY: ${PRIVATE_METADATA_ENCRYPTION_KEY:-}

services:
  web:
    <<: *service-defaults
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      PUBLIC_DATA_MODE: server
      PUBLIC_AUTH_MODE: ${PUBLIC_AUTH_MODE:-local}
      PUBLIC_API_BASE_URL: /api
      PUBLIC_KEYCLOAK_URL: /auth
      PUBLIC_KEYCLOAK_REALM: finanzas
      PUBLIC_KEYCLOAK_CLIENT_ID: finanzas-web
    networks: [edge]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

  api:
    <<: *service-defaults
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      <<: *app-env
      NODE_ENV: production
      AUTH_MODE: ${AUTH_MODE:-local}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-43200}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_WINDOW_SECONDS: ${LOGIN_WINDOW_SECONDS:-900}
      APP_BASE_URL: ${APP_ORIGIN:?APP_ORIGIN es obligatorio}
      KEYCLOAK_ISSUER: ${APP_ORIGIN:?APP_ORIGIN es obligatorio}/auth/realms/finanzas
      KEYCLOAK_JWKS_URL: http://keycloak:8080/auth/realms/finanzas/protocol/openid-connect/certs
      KEYCLOAK_AUDIENCE: finanzas-api
      DEV_AUTH_ENABLED: "false"
      FIREFLY_HOUSEHOLD_TOKEN: ${FIREFLY_HOUSEHOLD_TOKEN:-}
      HOUSEHOLD_ID: ${HOUSEHOLD_ID:-household-demo}
      HOUSEHOLD_NAME: ${HOUSEHOLD_NAME:-Nuestro hogar}
      MEMBER_A_ID: ${MEMBER_A_ID:-member-a}
      MEMBER_A_NAME: ${MEMBER_A_NAME:-Persona 1}
      MEMBER_A_EMAIL: ${MEMBER_A_EMAIL:-member-a@example.invalid}
      MEMBER_A_USERNAME: ${MEMBER_A_USERNAME:-member-a}
      MEMBER_B_ID: ${MEMBER_B_ID:-member-b}
      MEMBER_B_NAME: ${MEMBER_B_NAME:-Persona 2}
      MEMBER_B_EMAIL: ${MEMBER_B_EMAIL:-member-b@example.invalid}
      MEMBER_B_USERNAME: ${MEMBER_B_USERNAME:-member-b}
      FIREFLY_PRIVATE_TOKEN_MEMBER_A: ${FIREFLY_PRIVATE_TOKEN_MEMBER_A:-}
      FIREFLY_PRIVATE_TOKEN_MEMBER_B: ${FIREFLY_PRIVATE_TOKEN_MEMBER_B:-}
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
      TRM_SYNC_ENABLED: ${TRM_SYNC_ENABLED:-false}
      TRM_PRIMARY_URL: ${TRM_PRIMARY_URL:-https://www.superfinanciera.gov.co/SuperfinancieraWebServiceTRM/TCRMServicesWebService/TCRMServicesWebService}
      TRM_FALLBACK_URL: ${TRM_FALLBACK_URL:-https://www.datos.gov.co/resource/32sa-8pi3.json}
      OPEN_FINANCE_MOCK_ENABLED: ${OPEN_FINANCE_MOCK_ENABLED:-false}
      OPEN_FINANCE_MOCK_SECRET: ${OPEN_FINANCE_MOCK_SECRET:-}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      firefly: { condition: service_healthy }
      ai-cfo: { condition: service_healthy }
    networks: [edge, backend]
    secrets: [okle_private_metadata_keyring]
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  ai-cfo:
    <<: *service-defaults
    build: ./services/ai-cfo
    environment:
      TZ: America/Bogota
      AI_CFO_INTERNAL_TOKEN: ${AI_CFO_INTERNAL_TOKEN:?AI_CFO_INTERNAL_TOKEN es obligatorio}
      AI_PROVIDER: ${AI_PROVIDER:-disabled}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-terra}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      AI_COMPATIBLE_PROVIDER_NAME: ${AI_COMPATIBLE_PROVIDER_NAME:-OpenAI compatible}
      AI_COMPATIBLE_BASE_URL: ${AI_COMPATIBLE_BASE_URL:-}
      AI_COMPATIBLE_API_KEY: ${AI_COMPATIBLE_API_KEY:-}
      AI_COMPATIBLE_MODEL: ${AI_COMPATIBLE_MODEL:-}
      AI_COMPATIBLE_STRUCTURED_MODE: ${AI_COMPATIBLE_STRUCTURED_MODE:-json_schema}
      AI_COMPATIBLE_HTTP_REFERER: ${AI_COMPATIBLE_HTTP_REFERER:-}
      AI_COMPATIBLE_APP_NAME: ${AI_COMPATIBLE_APP_NAME:-OKLE}
      AI_ALLOW_INSECURE_HTTP: ${AI_ALLOW_INSECURE_HTTP:-false}
    networks: [backend]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  postgres:
    <<: *service-defaults
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: finanzas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio}
      POSTGRES_DB: finanzas
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/10-databases.sql:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finanzas -d finanzas"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    <<: *service-defaults
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  firefly:
    <<: *service-defaults
    image: fireflyiii/core:version-6.6.3
    environment:
      APP_ENV: production
      APP_KEY: ${FIREFLY_APP_KEY:?FIREFLY_APP_KEY es obligatorio}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: firefly
      DB_USERNAME: finanzas
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio}
      TZ: America/Bogota
      TRUSTED_PROXIES: "**"
    volumes: ["firefly_upload:/var/www/html/storage/upload"]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8080/health >/dev/null || exit 1",
        ]
      interval: 20s
      timeout: 8s
      retries: 15
      start_period: 60s

networks:
  edge:
  backend:

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  firefly_upload:

secrets:
  okle_private_metadata_keyring:
    file: ${PRIVATE_METADATA_KEYRING_HOST_FILE:-./secrets/private-metadata-keyring.json}
