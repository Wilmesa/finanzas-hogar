services:
  web:
    environment:
      PUBLIC_AUTH_MODE: keycloak

  api:
    environment:
      AUTH_MODE: keycloak
    depends_on:
      keycloak: { condition: service_healthy }

  gateway:
    volumes:
      - ./infra/caddy/routes.keycloak.caddy:/etc/caddy/routes.caddy:ro
    depends_on:
      keycloak: { condition: service_healthy }

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.3
    restart: unless-stopped
    command:
      [
        "start",
        "--import-realm",
        "--proxy-headers",
        "xforwarded",
        "--http-enabled",
        "true",
        "--http-relative-path",
        "/auth",
      ]
    environment:
      APP_ORIGIN: ${APP_ORIGIN:?APP_ORIGIN es obligatorio}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: finanzas
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD es obligatorio}
      KC_HOSTNAME: ${APP_ORIGIN:?APP_ORIGIN es obligatorio}/auth
      KC_HOSTNAME_STRICT: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_MANAGEMENT_SCHEME: http
    volumes:
      - ./runtime/keycloak/finanzas-realm.json:/opt/keycloak/data/import/finanzas-realm.json:ro
    depends_on:
      postgres: { condition: service_healthy }
    networks: [edge, backend]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "{ printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0; grep -q 'HTTP/1.0 200'; } 0<>/dev/tcp/127.0.0.1/9000",
        ]
      interval: 15s
      timeout: 5s
      retries: 24
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
