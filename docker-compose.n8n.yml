services:
  api:
    environment:
      N8N_AUTOMATION_TOKEN: ${N8N_AUTOMATION_TOKEN:?N8N_AUTOMATION_TOKEN es obligatorio}

  n8n:
    image: n8nio/n8n:2.29.11
    restart: unless-stopped
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: finanzas
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio}
      GENERIC_TIMEZONE: America/Bogota
      TZ: America/Bogota
      FINANZAS_API_URL: http://api:3000
      N8N_AUTOMATION_TOKEN: ${N8N_AUTOMATION_TOKEN:?N8N_AUTOMATION_TOKEN es obligatorio}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY es obligatorio}
    volumes: ["n8n_data:/home/node/.n8n"]
    depends_on:
      postgres: { condition: service_healthy }
      api: { condition: service_healthy }
    networks: [backend]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5678/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 15
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  n8n_data:
