name: Calidad y construcción

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No depender del postinstall de @prisma/client: CI parte de node_modules limpio.
      - run: pnpm db:generate
      - run: pnpm pwa:icons && git diff --exit-code -- apps/web/static/icons
      - run: pnpm verify
      - run: test -f apps/web/build/client/service-worker.js
      - name: Validar despliegues Compose
        run: |
          node scripts/init-env.mjs
          node scripts/configure-domain.mjs
          node scripts/preflight.mjs --bootstrap
          DEPLOY_TARGET=private scripts/compose.sh config --quiet
          DEPLOY_TARGET=public AUTH_MODE=keycloak PUBLIC_AUTH_MODE=keycloak node scripts/configure-domain.mjs
          DEPLOY_TARGET=public AUTH_MODE=keycloak PUBLIC_AUTH_MODE=keycloak scripts/compose.sh config --quiet
          docker compose -f docker-compose.yml -f docker-compose.private.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.public.yml config --quiet
          N8N_AUTOMATION_TOKEN="$(openssl rand -hex 24)" \
            N8N_ENCRYPTION_KEY="$(openssl rand -hex 32)" \
            docker compose -f docker-compose.yml -f docker-compose.private.yml -f docker-compose.n8n.yml config --quiet
          test -z "$(git status --porcelain)"
      - name: Construir imágenes propias
        run: DEPLOY_TARGET=private scripts/compose.sh build web api ai-cfo
      - name: Arranque real y autenticación local
        run: scripts/smoke-local-auth.sh

  ai-cfo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e "services/ai-cfo[test]"
      - run: python -m pytest services/ai-cfo/tests -q
